name: Release ReDub

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  check:
    name: Test & Typecheck
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Verify tag and package version
        run: node -e "if ('v' + require('./package.json').version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - run: npm test
      - run: npm run typecheck

  build:
    name: Build ${{ matrix.label }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Intel
            os: macos-14
            cache-id: macos-x64
            command: npx electron-builder --config electron-builder.config.cjs --mac dmg zip --x64 --publish never
          - label: macOS Apple Silicon
            os: macos-14
            cache-id: macos-arm64
            command: npx electron-builder --config electron-builder.config.cjs --mac dmg zip --arm64 --publish never
          - label: Windows x64
            os: windows-latest
            cache-id: windows-x64
            command: npx electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never
    runs-on: ${{ matrix.os }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.cache/npm
      ELECTRON_CACHE: ${{ github.workspace }}/../.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../.cache/electron-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore release caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/npm
            ${{ github.workspace }}/../.cache/electron
            ${{ github.workspace }}/../.cache/electron-builder
          key: redub-release-v1-node22-${{ runner.os }}-${{ matrix.cache-id }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            redub-release-v1-node22-${{ runner.os }}-${{ matrix.cache-id }}-
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run build
      - name: Build installer
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: redub-${{ matrix.label }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Prepare release notes
        shell: bash
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            cp "$notes_file" release-notes.md
          else
            cat << 'EOF' > release-notes.md
### ReDub 桌面端发布

保留背景与原声质感的本地 AI 配音工作室：导入视频、音频或台词，分离人声与背景，逐句校对、翻译、配音、合并并导出成片。

#### 核心特性
- **本地音视频分离与识别**：本地运行人声与背景音轨分离，Whisper 台词切分与时间轴识别。
- **逐句翻译与 AI 配音**：多渠道并发翻译与语音合成，支持微软 TTS 与火山音色模型。
- **原声参考音色库**：支持截取原声片段作为参考音色，快捷复用与音色库管理。
- **实时混音预览与无损导出**：保留视频原始画质容器，智能混音并追加配音轨，同步生成外挂字幕。

#### 安装文件说明
- **macOS (Apple Silicon, M 系列芯片)**：`ReDub-*-mac-arm64.dmg` / `.zip`
- **macOS (Intel 芯片)**：`ReDub-*-mac-x64.dmg` / `.zip`
- **Windows (x64)**：`ReDub-*-win-x64.exe`
EOF
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ReDub ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
